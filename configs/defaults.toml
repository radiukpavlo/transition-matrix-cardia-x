[project]
name = "transition-matrix-ecg"
version = "0.1.0"
ontology_version = "2026-07-21-v3"
seed = 17

[paths]
root = "."
data_lock = "data/archives"
raw = "data/raw"
interim = "data/interim"
features = "data/processed/features"
latents = "data/processed/latents"
models = "artifacts/models"
transition = "artifacts/transition"
reports = "artifacts/reports"
manifests = "artifacts/manifests"
logs = "artifacts/logs"

[datasets.ptbxl]
name = "ptbxl"
version = "1.0.3"
archive = "ptb-xl-a-large-publicly-available-electrocardiography-dataset-1.0.3.zip"
extract_dir = "ptbxl"
metadata_csv = "ptbxl_database.csv"
train_folds = [1, 2, 3, 4, 5, 6, 7, 8]
val_folds = [9]
test_folds = [10]

[datasets.ptbxl_plus]
name = "ptbxl_plus"
version = "1.0.1"
archive = "ptb-xl-a-comprehensive-electrocardiographic-feature-dataset-1.0.1.zip"
extract_dir = "ptbxl_plus"

[datasets.ludb]
name = "ludb"
version = "1.0.1"
archive = "lobachevsky-university-electrocardiography-database-1.0.1.zip"
extract_dir = "ludb"
repeats = 3
folds = 5

[splits]
ptbxl_train_target_rows = 10000
ptbxl_preserve_demographics = true
ptbxl_preserve_noise = true
ptbxl_preserve_pacemaker = true

[filters.detection]
highpass_hz = 0.67
lowpass_hz = 150.0
line_frequency_hz = 50.0
apply_notch_if_present = true

[filters.diagnostic]
highpass_hz = 0.05
lowpass_hz = 150.0
line_frequency_hz = 50.0
apply_notch_if_present = true

[thresholds]
lead_ii_snr_db = 5.0
minimum_valid_beats = 5
minimum_analyzable_fraction = 0.5
minimum_rhythm_lead_coverage = 1.0
minimum_p_wave_lead_coverage = 0.67
minimum_qrs_lead_coverage = 0.6
minimum_st_t_lead_coverage = 0.6
feature_quality_min_db = 5.0
detector_agreement_minimum = 0.5
delineation_confidence_minimum = 0.5
r_peak_match_tolerance_ms = 60.0
minimum_analyzable_rr_s = 0.25
maximum_analyzable_rr_s = 2.5
extraction_workers = 8
minimum_af_analyzable_duration_s = 7.5
minimum_af_valid_beats = 10
qrs_wide_ms = 120.0
t_inverted_threshold_mv = -0.1
t_inverted_duration_ms = 80.0
eps = 0.001
qrs_fragment_prominence_mv = 0.05

[latents]
penultimate_dim = 512
pooling = "trimmed_mean_10pct"
variance_retained = 0.99

[transition]
lambda_grid = [0.01, 0.1, 1.0, 10.0, 100.0]
rank_cap = 512
rank_grid = [32, 64, 128, 256, 512]
stability_bootstrap_replicates = 100
stability_seed = 17
stability_top_features = 20
stability_minimum_frequency = 0.60
maximum_missing_latent_fraction = 0.01
minimum_target_observations = 10
output_rank_grid = [4, 8, 16]
robust_challengers = ["ridge", "elastic_net", "huber"]
robust_alpha_grid = [0.001]
elastic_net_l1_ratio = 0.5

[training]
epochs = 2
batch_size = 32
learning_rate = 0.001
num_workers = 0
samples_per_beat = 256
pre_r_seconds = 0.25
post_r_seconds = 0.45

[reporting]
bootstrap_replicates = 1000
null_replicates = 250

[dss]
alpha = 0.65
min_support = 5
max_depth = 3
max_rules_per_label = 25
soft_match_min_fraction = 0.60
orientation = "B_hat = A @ T"
research_use_only = true
signature_artifact = "artifacts/transition/signature_artifact_v1.json"
close_vote_ratio = 1.10
low_strength_threshold = 0.20
contradiction_penalty = 0.25
hard_veto_criticality = 1.5
strict_selection = true
allow_research_feature_fallback = false
minimum_calibration_confidence = 0.70
minimum_metric_lower_bound = 0.80
minimum_analyzable_coverage = 0.80
maximum_abstention_rate = 0.20
minimum_fold_stability = 0.80
maximum_calibration_error = 0.10
minimum_global_accuracy = 0.90
minimum_rule_oof_precision = 0.80
minimum_rule_oof_recall = 0.80
minimum_rule_fold_stability = 0.80
minimum_rule_positive_folds = 3
global_accuracy_definition = "compatibility_subset_exact_match"
allowed_metric_provenance = ["held_out_compatibility_head", "external_compatibility_audit", "row_level_compatibility_predictions"]
allowed_evaluation_partitions = ["held_out_test", "external_test", "external_validation"]
