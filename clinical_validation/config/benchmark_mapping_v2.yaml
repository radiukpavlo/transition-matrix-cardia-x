    {"id": "BENCH-STD", "axis": "repolarization", "finding": "st_depression", "match": "exact_ci", "terms": ["STD_", "ST depression", "ST-depression"]},
    {"id": "BENCH-T", "axis": "repolarization", "finding": "t_wave_abnormality", "match": "exact_ci", "terms": ["NDT", "NT_", "TAB_", "T-wave abnormality"]},
    {"id": "BENCH-STT", "axis": "repolarization", "finding": "nonspecific_st_t", "match": "exact_ci", "terms": ["NST_", "DIG", "ISC_", "ISCA", "ISCI", "ISCL", "STTC"]},
    {"id": "BENCH-QTC", "axis": "repolarization", "finding": "qtc_abnormality", "match": "exact_ci", "terms": ["LNGQT", "Long QT"]},
    {"id": "BENCH-PACED", "axis": "pacing", "finding": "present", "match": "exact_ci", "terms": ["Paced", "paced rhythm", "pacemaker"]},
    {"id": "BENCH-OTHER", "axis": "residual", "finding": "other_abnormal", "match": "exact_ci", "terms": ["Other / unmapped", "Other abnormal"]}
  ]
}
