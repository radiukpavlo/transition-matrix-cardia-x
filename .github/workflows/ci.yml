name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify public research snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Verify public manifest
        run: python -m tm_ecg.reproducibility

      - name: Verify reported results
        run: tm-ecg-verify-reported

      - name: Check environment readiness
        run: python -m tm_ecg.cli doctor

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check src tests tasks.py

      - name: Run mypy
        run: python -m mypy src/tm_ecg/reproducibility.py
